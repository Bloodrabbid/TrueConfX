# Сборка установщиков под macOS, Windows и Linux.
# Пуш тега v* — собрать и выложить в релиз; вручную (Run workflow) — только артефакты сборки.
name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --mac
          - os: windows-latest
            args: --win
          - os: ubuntu-latest
            args: --linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      - name: Проверка типов и сборка интерфейса
        run: npm run build

      - name: Установщики
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          # Подписи нет: без сертификата Apple/Microsoft собираем неподписанные пакеты.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: TrueConfX-${{ runner.os }}
          path: |
            app/release/*.dmg
            app/release/*.exe
            app/release/*.AppImage
            app/release/*.deb
          if-no-files-found: error

  # Родной пакет Arch (.pkg.tar.zst): makepkg по нашему PKGBUILD из только что собранного .deb.
  arch:
    needs: build
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: makepkg
        run: |
          pacman -Syu --noconfirm --needed base-devel
          ver=$(sed -n 's/.*"version": "\(.*\)".*/\1/p' app/package.json | head -1)
          packaging/update-recipes.sh "$ver" dist
          # Ставим зависимости из PKGBUILD: заодно проверяем, что такие пакеты есть в Arch.
          (source packaging/arch/PKGBUILD && pacman -S --noconfirm --needed "${depends[@]}")
          useradd -m builder
          mkdir /build && cp packaging/arch/PKGBUILD /build/
          cp "dist/TrueConfX-$ver-linux-amd64.deb" "/build/TrueConfX-$ver.deb"
          chown -R builder /build
          cd /build && sudo -u builder makepkg -f --noconfirm
          # .SRCINFO для AUR должен совпадать с тем, что выводит makepkg.
          sudo -u builder makepkg --printsrcinfo | diff -u - "$GITHUB_WORKSPACE/packaging/arch/.SRCINFO"
          # Пакет должен содержать запускаемый файл и ярлык — иначе сборка ломаная.
          tar -tf trueconfx-bin-*.pkg.tar.zst | grep -qx 'opt/TrueConfX/trueconfx'
          tar -tf trueconfx-bin-*.pkg.tar.zst | grep -qx 'usr/share/applications/trueconfx.desktop'
          # База своего репозитория pacman: лежит в релизе, Server = .../releases/latest/download.
          sudo -u builder repo-add trueconfx.db.tar.gz trueconfx-bin-*.pkg.tar.zst
          mkdir "$GITHUB_WORKSPACE/arch-out"
          cp trueconfx-bin-*.pkg.tar.zst trueconfx.db.tar.gz trueconfx.files.tar.gz "$GITHUB_WORKSPACE/arch-out/"
          # trueconfx.db и trueconfx.files — симлинки; в релиз кладём настоящие копии.
          cp -L trueconfx.db trueconfx.files "$GITHUB_WORKSPACE/arch-out/"

      - uses: actions/upload-artifact@v4
        with:
          name: TrueConfX-Arch
          path: arch-out/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, arch]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

      # PKGBUILD и cask для brew с sha256 нового релиза — коммитом в main.
      - name: Обновить рецепты
        run: |
          ver="${GITHUB_REF_NAME#v}"
          packaging/update-recipes.sh "$ver" dist
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packaging/arch/PKGBUILD packaging/arch/.SRCINFO Casks/trueconfx.rb
          git diff --cached --quiet || { git commit -m "Рецепты Arch и Homebrew для $ver"; git push origin main; }

  # Проверка репозитория pacman так, как его подключит пользователь: чистый Arch, установка из релиза.
  pacman-repo:
    needs: release
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: pacman -S trueconfx-bin из релиза
        run: |
          printf '\n[trueconfx]\nSigLevel = Optional TrustAll\nServer = https://github.com/Bloodrabbid/TrueConfX/releases/latest/download\n' >> /etc/pacman.conf
          pacman -Sy --noconfirm
          pacman -Si trueconfx-bin
          pacman -S --noconfirm trueconfx-bin
          test -x /usr/bin/trueconfx
          pacman -Qi trueconfx-bin | grep -E '^(Name|Version)'
